# Engram — DeepSeek Harness nudge patch
# =====================================
# Enables the harness's Claude Code hook bridge and points it at Engram's
# stock SessionStart hook (the due-review nudge — at most two quiet lines,
# silent when nothing is due). Engram's skills and instructions need no
# patch at all: dsh discovers ~/.agents/skills natively, and the hook script
# self-resolves its engine from its own location.
#
# Install — TWO steps, and the order matters:
#
#   1. Install the bridge package into the profile (it is NOT part of the
#      dsh npm bundle's dependency closure — a patch naming an unresolvable
#      plugin fails SILENTLY at boot, which looks exactly like success):
#        corepack pnpm --version || npm i -g pnpm   # dsh's plugin command needs pnpm
#        dsh plugin --profile web add @deepseek-ai/dsh-hooks-claude-code
#   2. Open $DSH_HOME/profiles/<profile>/cordis.patch.yml (created on the
#      profile's first boot), REPLACE the trailing empty list `[]` with the
#      block below, and restart that profile. Appending after the `[]` is
#      invalid YAML and dsh refuses to boot (that failure IS loud).
#      (Repeat both steps per profile you use: web, headless.)
#
# Verification is a hook EVENT, not a clean boot: after your next session
# starts, `grep hook/invoked $DSH_HOME/sessions/*/*.jsonl` (or check the
# session's event view) — a clean boot proves nothing about the bridge.
#
# Replace both paths with your absolute home path (e.g. /Users/you/...) —
# `~` is not expanded inside patch config strings.
- id: engram-hooks
  name: '@deepseek-ai/dsh-hooks-claude-code'
  config:
    configPath: /ABSOLUTE/HOME/.agents/engram/dsh/hooks.json
    pluginRoot: /ABSOLUTE/HOME/.agents/engram
